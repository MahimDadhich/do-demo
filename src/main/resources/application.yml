server:
  port: 43127

gateway:
  auth:
    enabled: true
    keys:
      # Lightweight demo key — override via GATEWAY_API_KEY in real deploys.
      - id: demo
        key: ${GATEWAY_API_KEY:gw_demo_key}
        scopes:
          - chat
  default-model: assistant-default
  timeouts:
    connect: 5s
    ttfb: 15s
    inter-chunk-idle: 30s
    attempt-overall: 120s
    request-overall: 180s
  max-targets: 3
  models:
    assistant-default:
      # First entry = primary. Remaining secondaries are tried by lowest cost first.
      targets:
        - provider: anthropic
          upstream-model: claude-sonnet-4-20250514
          credentials-ref: anthropic_default
          cost: 15.0
        - provider: openai
          upstream-model: gpt-4o
          credentials-ref: openai_default
          cost: 5.0

providers:
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
  openai-cheap:
    base-url: ${OPENAI_CHEAP_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_CHEAP_API_KEY:}
  openai-expensive:
    base-url: ${OPENAI_EXPENSIVE_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_EXPENSIVE_API_KEY:}
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    api-key: ${ANTHROPIC_API_KEY:}
    version: "2023-06-01"

logging:
  level:
    com.digitalocean.llmgateway: INFO
